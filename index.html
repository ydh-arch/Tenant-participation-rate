<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입주기업 프로그램 참여도 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        body.overflow-hidden {
            overflow: hidden;
        }
        .chart-container {
            position: relative;
            height: 180px;
            width: 180px;
        }
        @media (max-width: 768px) {
            .chart-container {
                height: 150px;
                width: 150px;
            }
        }
        .btn-active {
            background-color: #2563eb !important;
            color: white !important;
        }
        .btn-disabled {
             background-color: #e5e7eb !important; /* Tailwind gray-200 */
             color: #6b7280 !important; /* Tailwind gray-500 */
             cursor: not-allowed;
        }
        #modal-body::-webkit-scrollbar {
            width: 8px;
        }
        #modal-body::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 4px;
        }
        #modal-body::-webkit-scrollbar-track {
            background-color: #f3f4f6;
        }
        .company-card {
             cursor: pointer;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">입주기업 프로그램 참여도 대시보드</h1>
            <p class="text-gray-500 mt-2">기업별 프로그램 참여 현황을 확인하고 관리합니다.</p>
        </header>
        
        <div id="loading" class="text-center py-10">
            <p class="text-lg text-gray-600">데이터를 불러오는 중입니다...</p>
        </div>
        <div id="error" class="hidden text-center py-10 bg-red-100 text-red-700 rounded-lg">
            <p class="font-bold">데이터 로딩 실패!</p>
            <p class="text-sm mt-2">구글 시트 URL이 정확한지, '웹에 게시' 설정이 올바르게 되었는지 확인해주세요.</p>
        </div>

        <main id="dashboard" class="hidden">
            <div id="conducted-programs-summary" class="mb-6 bg-white p-4 rounded-lg shadow-sm text-gray-700">
            </div>

            <div class="space-y-6 mb-6">
                <div class="bg-white p-4 rounded-lg shadow-sm">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">과업 필터</h2>
                    <div id="task-filters" class="flex flex-wrap gap-2">
                        <button class="filter-btn bg-gray-200 text-gray-700" data-filter-group="task" data-filter="전체">전체</button>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">유형 필터</h2>
                    <div id="type-filters" class="flex flex-wrap gap-2">
                        <button class="filter-btn bg-gray-200 text-gray-700" data-filter-group="type" data-filter="전체">전체</button>
                        <button class="filter-btn bg-gray-200 text-gray-700" data-filter-group="type" data-filter="게임벤처4.0">게임벤처4.0</button>
                        <button class="filter-btn bg-gray-200 text-gray-700" data-filter-group="type" data-filter="입주사">입주사</button>
                        <button class="filter-btn bg-gray-200 text-gray-700" data-filter-group="type" data-filter="졸업사">졸업사</button>
                        <!-- [수정] 버튼 텍스트와 data-filter 값을 '미참여'로 변경 -->
                        <button class="filter-btn bg-gray-200 text-gray-700" data-filter-group="type" data-filter="미참여">미참여</button>
                    </div>
                </div>
                 <div class="bg-white p-4 rounded-lg shadow-sm">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">정렬</h2>
                    <div id="sort-buttons" class="flex flex-wrap gap-2">
                        <button class="sort-btn bg-gray-200 text-gray-700" data-sort="rate">참여율순</button>
                        <button class="sort-btn bg-gray-200 text-gray-700" data-sort="name">가나다순</button>
                    </div>
                </div>
            </div>
            
            <div id="non-participants-link-container" class="mb-4 text-right"></div>

            <div id="company-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>

        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4 transition-opacity duration-300">
        <div id="modal-content" class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[85vh] flex flex-col">
            <div class="p-4 border-b sticky top-0 bg-white z-10 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800"></h2>
                <button id="modal-close" class="text-gray-500 hover:text-gray-800 text-3xl leading-none">&times;</button>
            </div>
            <div id="modal-body" class="p-4 overflow-y-auto">
            </div>
        </div>
    </div>

    <script>
        const PROGRAM_TOTALS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRQDN4fytLBWube8EmTy79jogli2J8AKjY9CP1THE0FiuioSEIMYkyW8yrBNO6nLTx6NOinO8KKMCOJ/pub?gid=0&single=true&output=csv';
        const PARTICIPATION_DATA_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRQDN4fytLBWube8EmTy79jogli2J8AKjY9CP1THE0FiuioSEIMYkyW8yrBNO6nLTx6NOinO8KKMCOJ/pub?gid=2095730984&single=true&output=csv';

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const dashboardEl = document.getElementById('dashboard');
        const companyGrid = document.getElementById('company-grid');
        const modal = document.getElementById('modal'); 
        
        let allCompanyData = [];
        let rawParticipationData = [];
        let nonParticipatingCompanies = []; 
        let totalsMap = {}; 
        let conductedProgramsCount = {}; 
        let currentTaskFilter = '전체';
        let currentTypeFilter = '전체';
        let currentSortOrder = 'rate'; 

        const COLORS = {
            '교육지원': 'rgba(59, 130, 246, 0.8)',
            '투자유치지원': 'rgba(16, 185, 129, 0.8)',
            '네트워킹': 'rgba(239, 68, 68, 0.8)',
            '채용지원': 'rgba(249, 115, 22, 0.8)',
            '기타': 'rgba(107, 114, 128, 0.8)',
            '배경': 'rgba(229, 231, 235, 0.8)'
        };

        async function fetchData() {
            try {
                if (typeof Papa === 'undefined') throw new Error('PapaParse 라이브러리를 불러오지 못했습니다.');
                
                const [totalsResponse, participationResponse] = await Promise.all([
                    fetch(PROGRAM_TOTALS_URL),
                    fetch(PARTICIPATION_DATA_URL),
                ]);

                if (!totalsResponse.ok) throw new Error(`시트 1(과업 수, 입주사 명단) 로딩 실패 (상태: ${totalsResponse.status})`);
                if (!participationResponse.ok) throw new Error(`시트 2(참여 현황) 로딩 실패 (상태: ${participationResponse.status})`);
                
                const totalsText = await totalsResponse.text();
                const participationText = await participationResponse.text();
                
                const parseOptions = { header: true, skipEmptyLines: true, transformHeader: h => h.trim() };
                const totalsResult = Papa.parse(totalsText, parseOptions);
                const participationResult = Papa.parse(participationText, parseOptions);
                
                if (totalsResult.errors.length) throw new Error(`시트 1 파싱 오류: ${totalsResult.errors[0].message}`);
                if (participationResult.errors.length) throw new Error(`시트 2 파싱 오류: ${participationResult.errors[0].message}`);
                
                rawParticipationData = participationResult.data;

                return {
                    programTotals: totalsResult.data,
                    participationData: participationResult.data,
                };
            } catch (err) {
                console.error("데이터 로딩 중 오류 발생:", err);
                const errorMsgEl = errorEl.querySelector('p:last-child');
                errorMsgEl.textContent = `오류: ${err.message}. 자세한 내용은 개발자 도구(F12) Console을 확인해주세요.`;
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                return null;
            }
        }

        function getFormattedDate(dateString) {
            if (!dateString) return null;
            const partsKorean = dateString.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            if (partsKorean) {
                const year = partsKorean[1];
                const month = partsKorean[2].padStart(2, '0');
                const day = partsKorean[3].padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            try {
                const dateObj = new Date(dateString.replace(/\//g, '-')); 
                if (!isNaN(dateObj.getTime())) { 
                    const year = dateObj.getFullYear();
                    const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
                    const day = dateObj.getDate().toString().padStart(2, '0');
                    return `${year}-${month}-${day}`;
                }
            } catch (e) { /* ignore parse errors */ }

            console.warn("Could not parse date:", dateString); 
            return null; 
        }


        function processData(programTotals, participationData) {
            const TASK_NAME_COL = '과업명';
            const TOTAL_COUNT_COL = '총횟수';
            const COMPANY_COL = '기업명';
            const PARTICIPATED_TASK_COL = '참여과업';
            const TYPE_COL = '유형';
            const DETAIL_PROGRAM_COL = '상세프로그램명';
            const ALL_COMPANIES_COL = '입주기업명';
            const DATE_COL = '일자'; 

            totalsMap = {};
            const residentCompanyNames = new Set();
            programTotals.forEach(row => {
                const task = row[TASK_NAME_COL]?.trim();
                const count = row[TOTAL_COUNT_COL]?.trim();
                if (task && count) {
                    totalsMap[task] = parseInt(count, 10) || 0; 
                }
                const company = row[ALL_COMPANIES_COL]?.trim();
                if (company) {
                    residentCompanyNames.add(company);
                }
            });

            const conductedProgramsTemp = {};
            const allConductedProgramInstances = new Set(); 
            
            participationData.forEach(record => {
                const taskType = record[PARTICIPATED_TASK_COL]?.trim();
                const programName = record[DETAIL_PROGRAM_COL]?.trim();
                const formattedDate = getFormattedDate(record[DATE_COL]); 

                if (taskType && programName && formattedDate) { 
                    const programInstanceKey = `${taskType}_${programName}_${formattedDate}`; 
                    
                    if (!allConductedProgramInstances.has(programInstanceKey)) {
                         allConductedProgramInstances.add(programInstanceKey); 
                    }

                    if (!conductedProgramsTemp[taskType]) {
                        conductedProgramsTemp[taskType] = new Set();
                    }
                    conductedProgramsTemp[taskType].add(programInstanceKey);
                }
            });
            conductedProgramsCount = { total: allConductedProgramInstances.size }; 
            Object.keys(conductedProgramsTemp).forEach(task => {
                conductedProgramsCount[task] = conductedProgramsTemp[task].size; 
            });

            const participationMap = participationData.reduce((acc, record) => {
                const companyName = record[COMPANY_COL]?.trim();
                if (!companyName) return acc;
                if (!acc[companyName]) {
                    acc[companyName] = [];
                }
                acc[companyName].push(record);
                return acc;
            }, {});

            const allKnownCompanyNames = new Set([...residentCompanyNames, ...Object.keys(participationMap)]);
            
            allCompanyData = Array.from(allKnownCompanyNames).map(companyName => {
                const records = participationMap[companyName] || [];
                const isResident = residentCompanyNames.has(companyName);

                // [수정] 기본값 및 fallback 값을 '미참여'로 변경
                let type = '미참여'; 
                if (records.length > 0) {
                    type = records[records.length - 1][TYPE_COL]?.trim() || '미참여'; 
                }
                 if (!isResident && records.length > 0) {
                     type = '졸업사';
                 } else if (isResident && records.length === 0) {
                     type = '미참여'; // 입주사인데 참여 이력 없으면 미참여
                 }

                const participationByTask = {};
                const allParticipatedInstances = new Set(); 
                
                records.forEach(rec => {
                    const taskType = rec[PARTICIPATED_TASK_COL]?.trim();
                    const programName = rec[DETAIL_PROGRAM_COL]?.trim();
                    const formattedDate = getFormattedDate(rec[DATE_COL]); 

                    if (taskType && programName && formattedDate) { 
                         const programInstanceKey = `${taskType}_${programName}_${formattedDate}`; 
                         
                        if (!participationByTask[taskType]) {
                            participationByTask[taskType] = new Set();
                        }
                        participationByTask[taskType].add(programInstanceKey);
                        allParticipatedInstances.add(programInstanceKey); 
                    }
                });
                
                const participationCounts = {};
                Object.keys(participationByTask).forEach(task => {
                    participationCounts[task] = participationByTask[task].size; 
                });

                const totalParticipationCount = allParticipatedInstances.size;
                const overallRate = conductedProgramsCount.total > 0 ? (totalParticipationCount / conductedProgramsCount.total) * 100 : 0;


                return {
                    name: companyName,
                    type: type,
                    participationByTask: participationCounts,
                    totalParticipation: totalParticipationCount, 
                    overallRate: overallRate, 
                };
            });

            nonParticipatingCompanies = allCompanyData
                .filter(c => c.totalParticipation === 0)
                .map(c => c.name);
        }

        
        function renderDashboard() {
            let companiesToRender = [...allCompanyData];

            if (currentTypeFilter !== '전체') {
                companiesToRender = companiesToRender.filter(company => company.type === currentTypeFilter);
            }
             
            if (currentTaskFilter !== '전체') {
                 companiesToRender = companiesToRender.filter(company => company.participationByTask[currentTaskFilter] >= 0); 
            }

            if (currentTaskFilter !== '전체') {
                companiesToRender.sort((a, b) => (b.participationByTask[currentTaskFilter] || 0) - (a.participationByTask[currentTaskFilter] || 0));
            } else {
                if (currentSortOrder === 'rate') {
                    companiesToRender.sort((a, b) => b.overallRate - a.overallRate);
                } else if (currentSortOrder === 'name') {
                    companiesToRender.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                }
            }

            companyGrid.innerHTML = '';

            if (companiesToRender.length === 0) {
                companyGrid.innerHTML = `<p class="text-gray-500 col-span-full text-center">선택한 조건에 해당하는 기업이 없습니다.</p>`;
            } else {
                 companiesToRender.forEach((company, index) => {
                    const card = document.createElement('div');
                    card.className = 'company-card bg-white rounded-xl shadow-md p-6 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 cursor-pointer';
                    card.dataset.companyName = company.name; 
                    
                    const chartId = `chart-${company.name.replace(/[^a-zA-Z0-9]/g, '')}-${index}`; 

                    // [수정] companyTypeColors 키 변경: '미분류' -> '미참여'
                    const companyTypeColors = {
                        '게임벤처4.0': 'bg-blue-100 text-blue-800',
                        '입주사': 'bg-green-100 text-green-800',
                        '졸업사': 'bg-indigo-100 text-indigo-800',
                        '미참여': 'bg-gray-100 text-gray-800' // 수정됨
                    };
                    const typeColor = companyTypeColors[company.type] || 'bg-gray-100 text-gray-800';

                    let taskDetailsHtml = '<ul class="space-y-2 mt-4">';
                    Object.keys(totalsMap).sort().forEach(task => {
                        const participated = company.participationByTask[task] || 0;
                        const totalPlanned = totalsMap[task] || 0; 
                        taskDetailsHtml += `
                            <li class="text-sm text-gray-600 flex justify-between items-center">
                                <span>${task}</span>
                                <span class="font-semibold text-gray-800">${participated} / ${totalPlanned}회</span>
                            </li>
                        `;
                    });
                    taskDetailsHtml += '</ul>';

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h3 class="text-xl font-bold text-gray-800">${company.name}</h3>
                            <span class="text-xs font-semibold px-2 py-1 rounded-full ${typeColor}">${company.type}</span>
                        </div>
                        <div class="flex flex-col items-center my-4">
                            <div class="chart-container mx-auto">
                                <canvas id="${chartId}"></canvas>
                            </div>
                            <p class="mt-3 text-lg font-bold text-gray-700">전체 참여율: ${company.overallRate.toFixed(1)}%</p>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-600 border-b pb-2 mb-2">과업별 참여 현황</h4>
                            ${taskDetailsHtml}
                        </div>
                    `;
                    companyGrid.appendChild(card);
                    createDoughnutChart(chartId, company.overallRate);
                });
            }
        }
        
        function createDoughnutChart(chartId, overallRate) {
            const ctx = document.getElementById(chartId)?.getContext('2d');
            if(!ctx) return;
            const existingChart = Chart.getChart(chartId);
            if (existingChart) {
                existingChart.destroy();
            }

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [overallRate, 100 - overallRate > 0 ? 100 - overallRate : 0],
                        backgroundColor: [COLORS['투자유치지원'] || '#4ade80', COLORS['배경']],
                        borderColor: ['#fff'],
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                }
            });
        }

        function parseKoreanDateForSort(dateString) {
            if (!dateString) return null;
            const parts = dateString.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            if (parts) {
                const year = parts[1];
                const month = parts[2].padStart(2, '0');
                const day = parts[3].padStart(2, '0');
                return new Date(`${year}-${month}-${day}`);
            }
            try { return new Date(dateString); } catch (e) { return null; }
        }

        function showHistoryModal(companyName) {
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalTitle.textContent = `${companyName} 상세 참여 이력`;
            
            const historyData = rawParticipationData.filter(record => (record['기업명'] || '').trim() === companyName);
            
            if (historyData.length === 0) {
                 modalBody.innerHTML = '<p class="text-gray-500 text-center py-4">참여 이력이 없습니다.</p>';
            } else {
                const tableHeaders = ['일자', '참여과업', '상세프로그램명', '참석자명', '직급', '직군'];
                let tableHTML = `<div class="overflow-x-auto"><table class="w-full text-sm text-left text-gray-500">
                                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                                        <tr>`;
                tableHeaders.forEach(header => {
                    tableHTML += `<th scope="col" class="px-6 py-3">${header}</th>`;
                });
                tableHTML += `</tr></thead><tbody>`;

                historyData.sort((a, b) => {
                    const dateA = parseKoreanDateForSort(a['일자']);
                    const dateB = parseKoreanDateForSort(b['일자']);
                    if (dateA && dateB) return dateA - dateB; 
                    else if (dateA) return -1; 
                    else if (dateB) return 1; 
                    else return 0; 
                }).forEach(record => {
                    tableHTML += '<tr class="bg-white border-b">';
                    tableHeaders.forEach(header => {
                        tableHTML += `<td class="px-6 py-4">${record[header] || ''}</td>`;
                    });
                    tableHTML += '</tr>';
                });

                tableHTML += '</tbody></table></div>';
                modalBody.innerHTML = tableHTML;
            }

            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden'); 
        }

        function showNonParticipantsModal() {
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalTitle.textContent = '미참여 기업 목록';
            if (nonParticipatingCompanies.length > 0) {
                 modalBody.innerHTML = `<div class="p-4"><p class="text-gray-600">${nonParticipatingCompanies.sort((a,b) => a.localeCompare(b, 'ko')).join(', ')}</p></div>`;
            } else {
                 modalBody.innerHTML = '<p class="text-gray-500 text-center py-4">모든 기업이 1회 이상 참여했습니다.</p>';
            }
            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden'); 
        }
        
        function closeModal() {
            modal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden'); 
        }


        function renderConductedProgramsSummary() {
            const summaryEl = document.getElementById('conducted-programs-summary');
            let summaryText = `총 진행 프로그램: <strong>${conductedProgramsCount.total || 0}개</strong>`;
            
            const details = Object.keys(conductedProgramsCount)
                .filter(key => key !== 'total')
                .sort() 
                .map(task => `${task}: ${conductedProgramsCount[task] || 0}개`)
                .join(', ');
                
            if (details) {
                summaryText += ` (${details})`;
            }
            summaryEl.innerHTML = summaryText;
        }

        function setupUI() {
            const taskFiltersDiv = document.querySelector('#task-filters');
            Object.keys(conductedProgramsCount).filter(key => key !== 'total').sort().forEach(task => {
                 const button = document.createElement('button');
                 button.className = 'filter-btn bg-gray-200 text-gray-700';
                 button.dataset.filterGroup = 'task';
                 button.dataset.filter = task;
                 button.textContent = task;
                 taskFiltersDiv.appendChild(button);
            });

            document.getElementById('task-filters').addEventListener('click', (e) => {
                if(e.target.dataset.filterGroup === 'task'){
                    currentTaskFilter = e.target.dataset.filter;
                    updateActiveButton(document.querySelectorAll('[data-filter-group="task"]'), e.target);
                    if (currentTaskFilter !== '전체') {
                        deactivateSortButtons(); 
                    } else {
                        currentSortOrder = 'rate';
                        activateSortButton(document.querySelector('.sort-btn[data-sort="rate"]')); 
                    }
                    renderDashboard();
                }
            });
            document.getElementById('type-filters').addEventListener('click', (e) => {
                if(e.target.dataset.filterGroup === 'type'){
                    currentTypeFilter = e.target.dataset.filter;
                    updateActiveButton(document.querySelectorAll('[data-filter-group="type"]'), e.target);
                    renderDashboard();
                }
            });

            document.getElementById('sort-buttons').addEventListener('click', (e) => {
                 if(e.target.dataset.sort){
                    currentSortOrder = e.target.dataset.sort;
                    currentTaskFilter = '전체'; 
                    updateActiveButton(document.querySelectorAll('.sort-btn'), e.target);
                    updateActiveButton(document.querySelectorAll('[data-filter-group="task"]'), document.querySelector('[data-filter-group="task"][data-filter="전체"]'));
                    activateSortButtons(); 
                    renderDashboard();
                }
            });
            
            document.getElementById('modal-close').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });
            
            companyGrid.addEventListener('click', (e) => {
                const card = e.target.closest('.company-card');
                if (card && card.dataset.companyName) {
                    showHistoryModal(card.dataset.companyName);
                }
            });
            
            const linkContainer = document.getElementById('non-participants-link-container');
            linkContainer.innerHTML = ''; 
            if (nonParticipatingCompanies.length > 0) {
                const link = document.createElement('p');
                link.className = 'text-blue-600 hover:underline cursor-pointer';
                link.textContent = `프로그램 미참여 기업 ${nonParticipatingCompanies.length}곳 보기`;
                link.addEventListener('click', showNonParticipantsModal);
                linkContainer.appendChild(link);
            }

            updateActiveButton(document.querySelectorAll('[data-filter-group="task"]'), document.querySelector('[data-filter-group="task"][data-filter="전체"]'));
            updateActiveButton(document.querySelectorAll('[data-filter-group="type"]'), document.querySelector('[data-filter-group="type"][data-filter="전체"]'));
            updateActiveButton(document.querySelectorAll('.sort-btn'), document.querySelector('.sort-btn[data-sort="rate"]'));
        }

        function updateActiveButton(buttons, activeButton){
             buttons.forEach(btn => {
                btn.classList.remove('btn-active');
                btn.classList.add('bg-gray-200', 'text-gray-700');
             });
             if (activeButton) { 
                activeButton.classList.add('btn-active');
                activeButton.classList.remove('bg-gray-200', 'text-gray-700');
            }
        }

        function deactivateSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('btn-active');
                btn.classList.add('btn-disabled'); 
             });
        }
        function activateSortButtons() {
             document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('btn-disabled');
                btn.classList.add('bg-gray-200', 'text-gray-700'); 
             });
             const activeSortBtn = document.querySelector(`.sort-btn[data-sort="${currentSortOrder}"]`);
             if(activeSortBtn) updateActiveButton(document.querySelectorAll('.sort-btn'), activeSortBtn);
        }
        function activateSortButton(buttonToActivate) {
             activateSortButtons(); 
             updateActiveButton(document.querySelectorAll('.sort-btn'), buttonToActivate);
        }

        
        async function main() {
            const data = await fetchData();
            if (data) {
                processData(data.programTotals, data.participationData);
                loadingEl.classList.add('hidden');
                dashboardEl.classList.remove('hidden');
                setupUI();
                renderDashboard();
                renderConductedProgramsSummary(); 
            }
        }

        window.onload = main;

    </script>
</body>
</html>
